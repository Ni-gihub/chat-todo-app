name: "フロントエンド"
description: "UI・UX・画面まわりの機能追加・修正"

labels: []

body:
  - type: textarea
    id: task
    attributes:
      label: "やる事"
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: "概要"
      value: "- "

  - type: dropdown
    attributes:
      label: 優先度
      options:
        - 優先度高い
        - 優先度普通
        - 優先度低い

  - type: input
    attributes:
      label: 参考ドキュメントURL
      placeholder: "例：https://www.figma.com/file/xxxxxx/xxxxxx?"
